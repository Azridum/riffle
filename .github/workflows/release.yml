name: release

on:
  schedule:
    - cron: '0 4 * * *' # 04:00 UTC, nightly
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
      - run: go vet ./...
      - run: go test -race ./...
      - uses: go-semantic-release/action@v1
        id: semrel
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: warm module proxy
        if: steps.semrel.outputs.version != ''
        run: GOPROXY=proxy.golang.org go list -m github.com/Azridum/riffle@v${{ steps.semrel.outputs.version }}
